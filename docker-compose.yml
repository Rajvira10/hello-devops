# Local stack for the app.
#
#   cp .env.example .env          # sets COMPOSE_PROFILES=monitoring + Grafana creds
#   docker compose up -d --build
#
# Exposed to the host: app :8080 and Grafana :3000 (both bound to 127.0.0.1 by
# default; override with BIND_ADDR). Everything else talks over the internal
# "monitoring" network, which has no route to the outside world.

name: hello-devops

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

services:
  # ---------------------------------------------------------------- app ----
  app:
    <<: *hardening
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-0.1.0-local}
    image: hello-devops:local
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-local}
      SHUTDOWN_DELAY: "2s"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    networks: [frontend]
    read_only: true
    cap_drop: [ALL]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }
        reservations: { cpus: "0.10", memory: 32M }

networks:
  frontend: {}
