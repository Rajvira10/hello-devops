# Release pipeline: on every push to main, re-run the CI gates, build a
# multi-arch image, push it to ECR with immutable SHA + semver tags, sign it,
# then deploy to staging and (after approval) production with smoke tests and
# automatic rollback.
#
# Required configuration (no secrets — AWS access is via GitHub OIDC):
#   Repository variables:  AWS_REGION, ECR_REPOSITORY, AWS_PUSH_ROLE_ARN
#   Environment variables (environments "staging" and "production"):
#                          AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID, APP_URL
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half-way; queue the next one instead.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  # Until the AWS side exists (terraform/bootstrap + envs) and the variables
  # below are set, the release jobs are skipped instead of failing.
  not-configured:
    name: Release skipped (AWS not configured)
    needs: ci
    if: vars.AWS_PUSH_ROLE_ARN == ''
    runs-on: ubuntu-24.04
    steps:
      - run: |
          msg="AWS_PUSH_ROLE_ARN is not set — skipping image push and deploys. See README → CI/CD → Required configuration."
          echo "::notice::$msg"
          echo "### ⏭️ $msg" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, scan, push & sign
    needs: ci
    if: vars.AWS_PUSH_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the release git tag
      id-token: write   # GitHub OIDC → AWS, and keyless cosign signing
    outputs:
      version: ${{ steps.existing.outputs.version || steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute version
        id: version
        # MAJOR.MINOR from the VERSION file, PATCH = workflow run number:
        # every release gets a unique, monotonically increasing semver.
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be MAJOR.MINOR"; exit 1; }
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable in ECR, so a re-run (or manual dispatch) of an
      # already-built commit reuses that image and its original version.
      - name: Reuse image if this commit was already pushed
        id: existing
        run: |
          if details=$(aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0]' --output json 2>/dev/null); then
            digest=$(jq -r .imageDigest <<<"$details")
            version=$(jq -r --arg sha "$GITHUB_SHA" '[.imageTags[] | select(. != $sha)][0] // empty' <<<"$details")
            echo "Image for ${GITHUB_SHA} already exists ($digest, version ${version:-none}); skipping build."
            {
              echo "exists=true"
              echo "digest=$digest"
              echo "version=$version"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.exists != 'true'

      # No QEMU needed: the Dockerfile cross-compiles Go on the build
      # platform and the runtime stage has no RUN instructions.
      - name: Build & push multi-arch image
        id: push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,scope=main,mode=max
          provenance: mode=max
          sbom: true

      - name: Trivy — fail on CRITICAL vulnerabilities (pushed image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.existing.outputs.exists != 'true'

      - name: Sign image (keyless, Sigstore)
        if: steps.existing.outputs.exists != 'true'
        run: cosign sign --yes "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"

      - name: Tag release in git
        if: steps.existing.outputs.exists != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          {
            echo "### Image"
            echo "- version: \`${{ steps.existing.outputs.version || steps.version.outputs.version }}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- digest: \`${{ steps.push.outputs.digest || steps.existing.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy → staging
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}
      - name: Deploy, smoke test, auto-rollback
        run: |
          scripts/ci-deploy.sh --region "${{ vars.AWS_REGION }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --tag "${{ needs.build.outputs.version }}" \
            --url "${{ vars.APP_URL }}"

  deploy-production:
    name: Deploy → production
    needs: [build, deploy-staging]
    runs-on: ubuntu-24.04
    # Configure "Required reviewers" on this environment for a manual gate.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-production-${{ github.run_id }}
      - name: Deploy, smoke test, auto-rollback
        run: |
          scripts/ci-deploy.sh --region "${{ vars.AWS_REGION }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --tag "${{ needs.build.outputs.version }}" \
            --url "${{ vars.APP_URL }}"
