apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-devops
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # % of the CPU *request* (50m)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Wait 5 minutes of low load before removing pods to avoid flapping.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
