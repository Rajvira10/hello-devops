apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-devops

labels:
  - pairs:
      app.kubernetes.io/name: hello-devops
      app.kubernetes.io/part-of: hello-devops
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# NOTE: the Secret "hello-devops-secrets" is intentionally NOT defined here.
# It is created out-of-band (scripts/k8s-up.sh generates a random value) so
# no secret material is ever committed. See README → Kubernetes → Secrets.
