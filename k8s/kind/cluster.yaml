# kind cluster: 1 control plane + 2 workers so replicas spread across nodes
# and a node drain can be demonstrated. Host port 8088 → ingress (Traefik).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hello-devops
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
  - role: worker
