version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are already covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
